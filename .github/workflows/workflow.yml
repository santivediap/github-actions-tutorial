name: main-worklfow

env:
  IMAGE_REPOSITORY: santivediap/github-actions-tutorial

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # Run all unit tests.
  run-tests:
    runs-on: ubuntu-latest
    steps:
      # Check out the pull request's source code.
      - name: Check out source code
        uses: actions/checkout@v3

      # Install Go.
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "^1.14" # The Go version to download and use.
      - name: Print Go version
        run: go version

      # Run unit tests.
      - name: Run unit tests
        run: go test -v ./...
    # Build and release.
  build-and-release:
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - name: Check out source code
        uses: actions/checkout@v3
      - name: Build and push container image
        uses: docker/build-push-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ env.IMAGE_REPOSITORY }}
          tag_with_ref: true
          tag_with_sha: true
  # Deploy to Kubernetes.
  deploy:
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master'
    needs:
      - run-tests
      - build-and-release
    steps:
      - uses: actions/checkout@v3

      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > kubeconfig.yml

      - name: Kustomize image
        working-directory: ./manifests
        run: |
          kustomize edit set image \
            REPO:TAG=$IMAGE_REPOSITORY:sha-${GITHUB_SHA::7}

      - name: Deploy to Kubernetes
        run: |
          kubectl --kubeconfig kubeconfig.yml \
            apply --kustomize manifests/

      - name: Validate deployment
        run: |
          kubectl --kubeconfig kubeconfig.yml \
            rollout status --timeout 120s deployment/foobar